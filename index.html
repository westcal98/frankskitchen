<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b08">
<title>Frank's Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>


<header class="app-header">
  <div class="header-top">
    <div class="app-title">Frank's <span>Kitchen</span></div>
    <div class="header-right">
      <div class="header-badge">Chef IQ + Ninja AF</div>
      <button class="settings-gear-btn" onclick="openSettings()" title="Settings">⚙</button>
    </div>
  </div>
  <div class="search-wrap">
    <input class="search-input" type="text" placeholder="Search recipes..." id="searchInput" oninput="handleSearch()">
  </div>
</header>

<div class="nav-tabs">
  <button class="nav-tab active" id="nav-recipes" onclick="switchMainTab('recipes')">🍳 Recipes</button>
  <button class="nav-tab" id="nav-shop" onclick="switchMainTab('shop')">🛒 Shopping</button>
</div>

<div id="view-recipes">
<div class="filter-row" id="filterRow">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('breakfast', this)">🍳 Breakfast</button>
  <button class="filter-btn" onclick="setFilter('lunch', this)">🥪 Lunch</button>
  <button class="filter-btn" onclick="setFilter('dinner', this)">🍽️ Dinner</button>
  <button class="filter-btn" onclick="setFilter('dessert', this)">🍫 Dessert</button>
  <button class="filter-btn" onclick="setFilter('af', this)">Air Fryer</button>
  <button class="filter-btn" onclick="setFilter('pc', this)">Pressure Cooker</button>
  <button class="filter-btn" onclick="setFilter('combo', this)">Both</button>
</div>

<div class="main-content" id="mainContent"></div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<button class="add-recipe-fab" id="addRecipeFab" onclick="openAddRecipeForm()">+ Add Recipe</button>

</div><!-- end view-recipes -->

<!-- ── ADD RECIPE MODAL ── -->
<div id="addRecipeModal" class="modal-overlay hidden" onclick="if(event.target===this)closeAddRecipeForm()">
  <div class="modal-container">
    <div class="modal-header">
      <div class="modal-title">New Recipe</div>
      <button class="modal-close" onclick="closeAddRecipeForm()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Recipe Name *</label>
        <input class="form-input" id="rf-name" type="text" placeholder="e.g. Crispy Chicken Thighs" maxlength="80" autocomplete="off">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select class="form-select" id="rf-category">
            <option value="">Select...</option>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="dessert">Dessert</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Appliance</label>
          <select class="form-select" id="rf-appliance">
            <option value="af">Air Fryer</option>
            <option value="pc">Pressure Cooker</option>
            <option value="combo">Both</option>
            <option value="none">No Cook</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cook Time</label>
          <input class="form-input" id="rf-time" type="text" placeholder="e.g. 30 min" maxlength="30" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">Difficulty</label>
          <select class="form-select" id="rf-difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="rf-description" placeholder="Short description of this recipe..." rows="2"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Ingredients</label>
        <div id="rf-ingredients"></div>
        <button type="button" class="dyn-add-btn" onclick="addIngredientRow()">+ Add Ingredient</button>
      </div>
      <div class="form-group">
        <label class="form-label">Steps</label>
        <div id="rf-steps"></div>
        <button type="button" class="dyn-add-btn" onclick="addStepRow()">+ Add Step</button>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Chef's Notes</label>
        <textarea class="form-textarea" id="rf-notes" placeholder="Tips, substitutions, dial-in times..." rows="3"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel-btn" onclick="closeAddRecipeForm()">Cancel</button>
      <button class="modal-save-btn" onclick="saveNewRecipe()">Save Recipe</button>
    </div>
  </div>
</div>

<div id="view-shop" class="hidden">
  <div class="shop-wrap">
    <div class="shop-header">
      <div class="shop-title">Shopping List</div>
      <div class="shop-stats" id="shopStats">0 items</div>
    </div>
    <div class="shop-actions">
      <button class="shop-action-btn" onclick="clearBought()">Clear Bought</button>
      <button class="shop-action-btn" onclick="uncheckAll()">Uncheck All</button>
      <button class="shop-action-btn danger" onclick="clearAll()">Clear All</button>
    </div>
    <div class="shop-add-wrap">
      <div class="shop-add-row">
        <input class="shop-input" id="shopInput" type="text" placeholder="Add item..." 
          oninput="handleShopInput()" 
          onkeydown="if(event.key==='Enter')addShopItem()"
          autocomplete="off">
        <button class="shop-add-btn" onclick="addShopItem()">+</button>
      </div>
      <div class="shop-suggestions" id="shopSuggestions"></div>
    </div>
    <div id="shopList"></div>
  </div>
</div>
<!-- ── SETTINGS PANEL ── -->
<div id="settingsPanel" class="settings-overlay hidden" onclick="if(event.target===this)closeSettings()">
  <div class="settings-sheet">
    <div class="settings-header">
      <div class="settings-title">Settings</div>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="settings-body">
      <div class="settings-section-label">Backup &amp; Restore</div>
      <button class="settings-row" onclick="exportData()">
        <span class="settings-row-icon">⬇</span>
        <div class="settings-row-text">
          <div class="settings-row-title">Export Data</div>
          <div class="settings-row-sub">Download recipes, notes &amp; shopping list as JSON</div>
        </div>
      </button>
      <label class="settings-row" for="importFileInput">
        <span class="settings-row-icon">⬆</span>
        <div class="settings-row-text">
          <div class="settings-row-title">Import Data</div>
          <div class="settings-row-sub">Restore from a backup JSON file</div>
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display:none"
          onchange="importData(this.files[0]);this.value=''">
      </label>
      <button class="settings-row" onclick="exportPhotos()">
        <span class="settings-row-icon">📷</span>
        <div class="settings-row-text">
          <div class="settings-row-title">Export Photos</div>
          <div class="settings-row-sub">Download all recipe photos as a zip</div>
        </div>
      </button>
      <div class="settings-divider"></div>
      <div class="settings-section-label">Storage</div>
      <div class="settings-storage-row" id="storageUsage">Checking…</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
